services:
  postgres:
    image: postgres:16-alpine
    container_name: riaya-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: riaya
      POSTGRES_PASSWORD: riaya
      POSTGRES_DB: riaya
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U riaya -d riaya']
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - riaya_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: riaya-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - riaya_redisdata:/data

  mongo:
    image: mongo:7
    container_name: riaya-mongo
    restart: unless-stopped
    ports:
      - '27017:27017'
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 10s
      retries: 10
      # mongosh needs a few seconds to start inside the container; without a start
      # period the first probes count as failures and the service reports unhealthy.
      start_period: 30s
    volumes:
      - riaya_mongodata:/data/db

  # BP-031. The service starts even when redis or mongo is unhealthy; the
  # depends_on below only orders startup, and readiness reports the real state.
  realtime:
    build:
      context: .
      dockerfile: realtime/Dockerfile
    container_name: riaya-realtime
    restart: unless-stopped
    environment:
      NODE_ENV: production
      REALTIME_PORT: '4001'
      # Read from the host shell. Left empty on purpose: the service refuses to
      # boot without a 32+ character secret, which is a clearer failure than
      # making every other compose command depend on this variable being set.
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-}
      REDIS_URL: redis://redis:6379
      MONGO_URI: mongodb://mongo:27017/riaya
      REALTIME_CORS_ORIGINS: ${REALTIME_CORS_ORIGINS:-http://localhost:3000,http://localhost:5174}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - '4001:4001'
    depends_on:
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy

  # ADR 0003. Python microservices; both optional for the API (SCHEDULER_URL / COMMS_URL).
  scheduler:
    build:
      context: services/scheduler
    container_name: riaya-scheduler
    restart: unless-stopped
    environment:
      SERVICE_JWT_SECRET: ${SERVICE_JWT_SECRET:-}
      DATABASE_URL: postgresql://riaya:riaya@postgres:5432/riaya
    ports:
      - '4100:4100'
    depends_on:
      postgres:
        condition: service_healthy

  comms:
    build:
      context: services/comms
    container_name: riaya-comms
    restart: unless-stopped
    environment:
      SERVICE_JWT_SECRET: ${SERVICE_JWT_SECRET:-}
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DB: riaya_comms
    ports:
      - '4200:4200'
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  riaya_pgdata:
  riaya_redisdata:
  riaya_mongodata:
