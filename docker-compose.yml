services:
  postgres:
    image: postgres:16-alpine
    container_name: riaya-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: riaya
      POSTGRES_PASSWORD: riaya
      POSTGRES_DB: riaya
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U riaya -d riaya']
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - riaya_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: riaya-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - riaya_redisdata:/data

volumes:
  riaya_pgdata:
  riaya_redisdata:
